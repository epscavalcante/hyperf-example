name: CI - Hyperf

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout do código
      # ----------------------------
      - name: Checkout do código
        uses: actions/checkout@v4

      # ----------------------------
      # Configurar Docker Buildx com suporte a cache
      # ----------------------------
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # ----------------------------
      # Build da imagem com cache integrado do GitHub Actions
      # ----------------------------
      - name: Build da imagem de desenvolvimento (com cache GHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: myapp:test
          load: true # carrega a imagem localmente no runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------
      # Instalar dependências Composer
      # ----------------------------
      - name: Instalar dependências Composer
        run: |
          docker run --rm \
            -v $PWD:/var/www \
            -w /var/www \
            myapp:test composer install --prefer-dist --no-interaction --no-progress

      # ----------------------------
      # Rodar Linter (Pint, PHPStan, etc)
      # ----------------------------
      - name: Rodar Linter
        run: |
          docker run --rm \
            -v $PWD:/var/www \
            -w /var/www \
            myapp:test composer lint || true
      # ----------------------------
      # Listar arquivos
      # ----------------------------
      - name: Listar arquivos
        run: |
          docker run --rm \
            -v $PWD:/var/www \
            -w /var/www \
            myapp:test ls -lah

      # ----------------------------
      # Debug do BASE_PATH dentro do container
      # ----------------------------
      - name: Debug BASE_PATH
        run: |
          docker run --rm \
            -v $PWD:/var/www \
            -w /var/www \
            myapp:test php -r "
              require_once 'vendor/autoload.php';
              require_once 'tests/bootstrap.php';
              echo \"---- DEBUG ----\n\";
              echo 'getcwd(): ' . getcwd() . \"\n\";
              echo 'BASE_PATH: ' . (defined('BASE_PATH') ? BASE_PATH : '[NOT DEFINED]') . \"\n\";
              echo 'File exists vendor/autoload.php: ' . (file_exists('vendor/autoload.php') ? 'YES' : 'NO') . \"\n\";
              echo 'File exists app/: ' . (is_dir('app') ? 'YES' : 'NO') . \"\n\";
            "

      # - name: Pest
      #   run: |
      #     docker run --rm \
      #       -v $PWD:/var/www \
      #       -w /var/www \
      #       myapp:test composer test tests/Unit/AccountUnitTest.php

      - name: Pest
        run: |
          docker run --rm \
            -e BASE_PATH=/var/www \
            -v $PWD:/var/www \
            -w /var/www \
            myapp:test composer test

      # ----------------------------
      # Rodar Testes (Pest/PHPUnit)
      # ----------------------------
      # - name: Rodar Testes
      #   run: |
      #     docker run --rm \
      #       -v $PWD:/var/www \
      #       -w /var/www \
      #       myapp:test composer test -- tests/Unit/AccountUnitTest.php
