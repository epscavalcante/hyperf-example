name: CI - Hyperf

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Opcional: habilita o Buildx para cache eficiente
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache das camadas do Docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build da imagem de desenvolvimento
        run: |
          docker build \
            -f .docker/php.Dockerfile \
            -t myapp:test \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            .

      # (Workaround: renomeia cache após build)
      - name: Mover cache novo
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Rodar Composer Install
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            myapp:test composer install --prefer-dist --no-interaction

      - name: Rodar Linter (PHPStan / Pint / PHPCS)
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            myapp:test composer lint || true

      - name: Rodar Testes
        run: |
          docker run --rm \
            -v $PWD:/app \
            -w /app \
            myapp:test composer test -- tests/Unit/NameTest.php
