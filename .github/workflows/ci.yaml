name: CI/CD - Hyperf

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: swoole, openssl, sockets, pcntl
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --no-scripts --prefer-dist

      - name: Linter
        run: composer lint || true

      - name: Verify permissions
        run: ls -la vendor/bin

      - name: Versão do pest
        run: php vendor/bin/pest --version 

      - name: Autoload 
        run: php -r "require 'vendor/autoload.php'; echo 'autoload ok';"

      # - name: Run Tests
      #   run: vendor/bin/phpunit --testdox